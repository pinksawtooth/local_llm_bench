provider: mlx_serve
mode: performance
api_base: "http://127.0.0.1:11234/v1"
# ~/.mlx-serve/models 配下の mlx-serve 専用モデル。モデルIDは /v1/models の id と完全一致させます。
models:
  - "ddalcu/Qwen3.8-27B-MLX-Serve-4bit"
  - "ddalcu/Qwen3.8-Flash-Next-MLX-Serve-mixed-4-8bit"
  - "prism-ml/Ternary-Bonsai-2-27B-mlx-2bit"
mlx_serve:
  model_dirs: ["~/.mlx-serve/models"]
request:
  use_mlx_serve_defaults: true
performance:
  # 共通テキストの入力目安。実トークン数はAPIのusageから記録します。
  input_tokens: [1024, 4096, 8192]
  # mlx-serve の --max-concurrent（既定1）を超える同時実行はサーバー側で待機します。
  concurrency: [1, 2, 4]
  # memory_pid: 12345  # 指定時のみ、そのプロセスと子のRSSを観測。
runs:
  cold_runs: 0
  warm_runs: 3
  timeout_sec: 43200
  cooldown_sec: 0
output:
  history_json: "../runs/history.json"
  latest_json: "../runs/latest_run.json"
  report_html: "../docs/index.html"
  run_logs_dir: "../runs/logs"
