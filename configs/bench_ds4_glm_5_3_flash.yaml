provider: ds4
mode: prompt
api_base: "http://127.0.0.1:8001/v1"
models:
  - "glm-5.3-flash"

# RevBench と同じ実行ファイル・GGUFを使用。パスはこのYAMLからの相対指定。
# 開始時に起動・ロードし、終了時に自分のプロセスだけを停止します。
ds4:
  management: managed
  server_path: "../../RevBench/ds4/ds4-server"
  model_path: "../../RevBench/ds4/gguf/GLM-5.3-Flash-Q2.gguf"
  context_length: 32768
  startup_timeout_sec: 1200
  server_args: []

ds4_sampling:
  source: model_config
  temperature: 1.0
  top_p: 0.95
  top_k: 0
  min_p: 0.0

request:
  max_tokens: 8192
  reasoning_effort: high

runs:
  cold_runs: 1
  warm_runs: 3
  timeout_sec: 86400
  cooldown_sec: 0

output:
  history_json: "../runs/history.json"
  latest_json: "../runs/latest_run.json"
  report_html: "../docs/index.html"
  run_logs_dir: "../runs/logs"
