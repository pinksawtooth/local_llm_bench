# Sampling: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash
provider: ds4
mode: docker_task
api_base: "http://127.0.0.1:8001/v1"
models:
  - "deepseek-v4-flash"

ds4:
  management: managed
  server_path: "../../RevBench/ds4/ds4-server"
  model_path: "../../RevBench/ds4/gguf/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf"
  context_length: 32768
  startup_timeout_sec: 1200
  # --mtp-model は ds4-server のディレクトリを基準に解決されます。
  # ds4f-dspark のダウンロード完了が必要（.part は使用不可）。
  server_args:
    - "--dspark"
    - "--mtp-model"
    - "gguf/DeepSeek-V4-Flash-DSpark-support-0731.gguf"
    - "--mtp-exact-sampling"

benchmark:
  spec: "../benchmarks/d_compile/spec.yaml"
  answer_key: "../benchmarks/d_compile/spec.answers.yaml"
  question_timeout_sec: 3600
  ghidra_tool_mode: unrestricted

docker:
  image: "local-llm-bench:inspect-v1"
  platform: "linux/arm64"
  api_base: "http://host.docker.internal:8001/v1"

ds4_sampling:
  source: model_config
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  min_p: 0.0

request:
  max_tokens: 8192
  reasoning_effort: high

runs:
  cold_runs: 1
  warm_runs: 3
  timeout_sec: 86400
  cooldown_sec: 0

output:
  history_json: "../runs/history.json"
  latest_json: "../runs/latest_run.json"
  report_html: "../docs/index.html"
  run_logs_dir: "../runs/logs"
